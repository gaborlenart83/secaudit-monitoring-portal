services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-secaudit_db}
      MYSQL_USER: ${MYSQL_USER:-secaudit_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secaudit_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-mysql://secaudit_user:secaudit_pass@db:3306/secaudit_db}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
